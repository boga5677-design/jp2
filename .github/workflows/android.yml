name: NekoNihon Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Clean old APK outputs
        run: |
          rm -rf app/build/outputs/apk
          rm -rf output
          mkdir -p output

      - name: Build NekoNihon APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Prepare single APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" output/NekoNihon.apk

          COUNT=$(find output -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one APK, found $COUNT"
            exit 1
          fi

          echo "Generated APK:"
          ls -lh output/NekoNihon.apk

      - name: Upload NekoNihon APK
        uses: actions/upload-artifact@v4
        with:
          name: NekoNihon-APK
          path: output/NekoNihon.apk
          if-no-files-found: error
          retention-days: 30
