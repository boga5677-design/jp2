name: Android CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 取得專案
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 8.11.1
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      # 4. 顯示版本
      - name: Verify Java and Gradle
        run: |
          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          gradle --version

      # 5. 移除英文版殘留資料檔
      - name: Remove legacy PetLingo data
        run: |
          rm -f app/src/main/java/com/petlingo/app/data/PetData.kt
          echo "Legacy PetData.kt removed"

      # 6. 建立 Gradle Wrapper
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1

      # 7. gradlew 執行權限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 8. 清除舊 Build
      - name: Clean project
        run: |
          ./gradlew clean --no-daemon

      # 9. 編譯 Debug APK
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      # 10. 編譯 Release APK
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      # 11. 顯示產生的 APK
      - name: List generated APKs
        run: |
          echo "===== APK files ====="
          find app/build/outputs/apk -type f -name "*.apk" -print

      # 12. 上傳 APK
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nihongo-Go-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
